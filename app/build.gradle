plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // 谷歌官方推荐的用于隐藏地图 KEY 的插件 https://developers.google.com/maps/documentation/places/android-sdk/secrets-gradle-plugin?hl=zh-cn
    id "com.google.android.libraries.mapsplatform.secrets-gradle-plugin"
}

android {
    compileSdk = 36
    namespace = 'com.zcshou.gogogo'

    signingConfigs {
        debug {
            storeFile file('../keystore/GoGoGo.jks')
            storePassword 'GoGoGo'
            keyAlias 'GoGoKey'
            keyPassword 'GoGoGo'
        }
        release {
            storeFile file('../keystore/GoGoGo.jks')
            storePassword 'GoGoGo'
            keyAlias 'GoGoKey'
            keyPassword 'GoGoGo'
        }
    }

    defaultConfig {
        applicationId "com.soozooq.gogogo.test"
        minSdkVersion 27
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 35
        versionCode 2400099
        versionName '2.4.31-simple-support' // https://semver.org/lang/zh-CN/
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['zh', 'zh-rCN', 'en', 'en-rUS']
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
        signingConfig = signingConfigs.release
    }

    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled = true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources = true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            signingConfig = signingConfigs.release
            multiDexEnabled = true
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    // 要存取 secret value 必須要使用到一個 BuildScript 的類別，默认会从 local.properties 中获取
    buildFeatures {
        buildConfig = true
        aidl = true
    }

    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
            // Build-generated V0 assets are attached below via their producing task.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    packagingOptions {
        jniLibs {
            excludes += ['lib/armeabi/**']
        }
        resources {
            excludes += ['lib/armeabi/**']
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // 指定输出的可执行程序的名字
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                def fileName
                if (variant.buildType.name == 'release') {
                    fileName = "Go_${defaultConfig.versionName}_arm64-v8a_release.apk"
                } else {
                    fileName = "Go_${defaultConfig.versionName}_arm64-v8a_debug.apk"
                }
                outputFileName=fileName
            }
        }
    }
}


/**
 * The guest is a complete independently compiled APK, not another class
 * already compiled into Tianwaitian's host classes.dex. The APK is included
 * as a build-generated private asset, never installed as a second application.
 */
tasks.register('stageContainerV0Fixture', Copy) {
    dependsOn ':containerFixture:assembleDebug'
    from(project(':containerFixture').layout.buildDirectory.dir('outputs/apk/debug')) {
        include '*-debug.apk'
        rename { String ignored -> 'twt-fixture-v0.apk' }
    }
    into(layout.buildDirectory.dir('generated/containerV0Assets'))
}

// Register the Copy task itself as the asset source, NOT its raw output path.
// This lets Gradle/AGP infer builtBy for merge, lint model and release tasks,
// fixing implicit dependency validation in :app:generateReleaseLintVitalReportModel.
android.sourceSets.main.assets.srcDir(tasks.named('stageContainerV0Fixture'))

// This demo is an EXTERNAL user-selected file, never an embedded asset or a
// host dependency. Pin the exact independently compiled APK for this build.
// Only its small SHA/metadata record is compiled into the host.
def v31DemoApk = project(':externalDemo').layout.buildDirectory.file(
        'outputs/apk/debug/externalDemo-debug.apk')
def v31JavaDir = layout.buildDirectory.dir('generated/source/containerV31')
def v31TrustJson = layout.buildDirectory.file('generated/containerV31/external-demo-trust.json')
tasks.register('generateContainerV31Trust') {
    dependsOn ':externalDemo:assembleDebug'
    inputs.file(v31DemoApk)
    outputs.dir(v31JavaDir)
    outputs.file(v31TrustJson)
    doLast {
        def apk = v31DemoApk.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        apk.withInputStream { stream ->
            byte[] buffer = new byte[32768]
            int count
            while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        def sha = digest.digest().encodeHex().toString()
        def generated = new File(v31JavaDir.get().asFile,
                'com/zcshou/gogogo/virtualv0/ContainerV31BuildTrust.java')
        generated.parentFile.mkdirs()
        generated.setText('''package com.zcshou.gogogo.virtualv0;
/** Generated from the paired independent demo APK; never a fallback trust value. */
public final class ContainerV31BuildTrust {
    private ContainerV31BuildTrust() {}
    public static final String APK_SHA256 = "''' + sha + '''";
}
''', 'UTF-8')
        def metadata = v31TrustJson.get().asFile
        metadata.parentFile.mkdirs()
        metadata.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            apk_sha256: sha,
            package_name: 'com.soozooq.tianwaitian.externaldemo',
            version_code: 1,
            entry_class: 'com.soozooq.tianwaitian.externaldemo.DemoEntry'
        ])) + '\n', 'UTF-8')
    }
}
android.sourceSets.main.java.srcDir(
        files(v31JavaDir).builtBy(tasks.named('generateContainerV31Trust')))
// AGP materializes the source-directory FileCollection and can lose builtBy.
// Declare the producer explicitly for compilers as well as Lint/packaging.
tasks.withType(JavaCompile).configureEach {
    dependsOn 'generateContainerV31Trust'
}
tasks.matching {
    it.name.startsWith('compile') && it.name.endsWith('Kotlin')
}.configureEach {
    dependsOn 'generateContainerV31Trust'
}

tasks.matching {
    it.name == 'mergeDebugAssets' || it.name == 'mergeReleaseAssets'
}.configureEach {
    dependsOn 'stageContainerV0Fixture'
    dependsOn 'generateContainerV31Trust'
}

// AGP 8.12 Lint analysis/model tasks inspect the generated asset directory
// directly, but do not consistently inherit the sourceDir TaskProvider dependency.
// Every app Lint task must wait for the fixture staging task (Gradle 8.13 validation).
// This keeps release/debug Lint enabled instead of skipping failed checks.
tasks.matching {
    it.name.contains('Lint') || it.name.startsWith('lint')
}.configureEach {
    dependsOn 'stageContainerV0Fixture'
    dependsOn 'generateContainerV31Trust'
}


dependencies {
    // GoGoGo Lab: active open-source GPU map renderer.
    implementation 'org.maplibre.gl:android-sdk-opengl:13.5.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // MIT Java-8 library with bundled offline Chinese 7-digit prefix database (2025-02).
    implementation 'me.ihxq.projects:phone-number-geo:1.0.10-202502'
    // Required by the prefix database's logger; no network or logging backend is added.
    implementation 'org.slf4j:slf4j-api:1.7.36'
    // Silence only the lookup library's optional SLF4J logs, preserving number privacy.
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    // 腾讯地图 SDK (GCJ02 坐标系，与微信小程序一致)
    // 官方分包: vector-sdk (核心绘制) + openmap:foundation (LatLng/MapPoi 等基础类型)
    implementation 'com.tencent.map:tencent-map-vector-sdk:6.11.0.260507.ab2310c2.209828299'
    implementation 'com.tencent.openmap:foundation:0.9.0.e5ea763-pro'
    implementation 'com.tencent.map:sdk-utilities:1.0.10'
    // Tencent LBS location consumer SDK; read-only diagnostic, no provider injection.
    implementation 'com.tencent.map.geolocation:TencentLocationSdk-openplatform:7.6.1.12'
    // Google Play Services Location: 用于 FusedLocationProviderClient.setMockLocation
    // (WeChat 等部分应用在 Android 12+ 走 fused 路径,绕过 LocationManager test provider)
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'

    // AppCompat 1.5.1 开始显式依赖于 Lifecycle 2.5.1 和 SavedState 1.2.0
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.elvishew:xlog:1.11.1'
    implementation 'io.noties.markwon:core:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}
