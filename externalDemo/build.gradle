plugins {
    id 'com.android.application'
}

// A separate output APK. It is never a dependency or asset of the host APK.
android {
    namespace 'com.soozooq.tianwaitian.externaldemo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.soozooq.tianwaitian.externaldemo'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
