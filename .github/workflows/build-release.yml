name: Build No-Map APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Create local.properties
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'TENCENT_MAP_KEY=DUMMY\n' >> local.properties
          printf 'MAPS_API_KEY=\n' >> local.properties

      - name: Build debug APK and capture log
        shell: bash
        run: |
          chmod +x gradlew
          mkdir -p ci
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee ci/latest-build.log
          status=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Save failed build log to repository
        if: env.BUILD_EXIT_CODE != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/latest-build.log
          git commit -m "[skip ci] ci: save latest failed build log" || true
          git push

      - name: Upload APK
        if: env.BUILD_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: gogogo-no-map-wechat-test
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail job when build failed
        if: env.BUILD_EXIT_CODE != '0'
        run: exit 1
