name: Build No-Map APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android properties
        shell: bash
        run: |
          mkdir -p ci
          echo "step=prepare" > ci/diagnostic.txt
          echo "ANDROID_HOME=$ANDROID_HOME" >> ci/diagnostic.txt
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> ci/diagnostic.txt
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'TENCENT_MAP_KEY=DUMMY\n' >> local.properties
          printf 'MAPS_API_KEY=DUMMY\n' >> local.properties
          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee ci/latest-build.txt
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> ci/diagnostic.txt
          echo "BUILD_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Persist diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci/diagnostic.txt ci/latest-build.txt 2>/dev/null || true
          git commit -m "[skip ci] ci: persist build diagnostics" || true
          git push || true

      - name: Upload APK
        if: env.BUILD_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: gogogo-no-map-wechat-test
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Mark build failed
        if: env.BUILD_EXIT_CODE != '0'
        run: exit 1
