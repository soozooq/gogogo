name: Build No-Map APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-32" "build-tools;36.0.0" "ndk;26.2.11394342"

      - name: Create local.properties
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'TENCENT_MAP_KEY=DUMMY\n' >> local.properties
          printf 'MAPS_API_KEY=\n' >> local.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gogogo-no-map-wechat-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
