name: Build Preview APK

on:
  workflow_dispatch:
  # Build installable debug previews before merging UI/diagnostic labs.
  # This workflow uses read-only permissions and dummy public test keys.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/v31-external-demo-host
      - fix/location-input-validation
      - integration/gogogo-labs-main-20261009
      - x8-compat
      - fix/x8-modern-amap
      - feat/gogogo-lab-phase1
      - feat/gogogo-lab-phase2
      - feat/gogogo-lab-phase3
      - feat/gogogo-lab-phase4
      - feat/gogogo-lab-phase5
      - feat/gogogo-lab-phase6
      - feat/gogogo-lab-phase7
      - feat/gogogo-lab-phase8
      - feat/gogogo-lab-phase9
      - feat/gogogo-lab-phase10
      - feat/gogogo-lab-phase12
      - feat/gogogo-lab-phase13
      - feat/gogogo-ui-refresh
      - feat/gogogo-heading-lab14
      - feat/gogogo-heading-lab15
      - feat/gogogo-consumer-lab16
      - feat/gogogo-session-lab17
      - feat/gogogo-session-lab17-1
      - feat/gogogo-session-lab17-2
      - feat/gogogo-session-lab17-2-1
      - feat/gogogo-session-lab17-3
      - feat/gogogo-auto-lab18
      - feat/gogogo-survival-lab19
      - feat/gogogo-reliability-lab20
      - feat/gogogo-simulation-lab21
      - feat/gogogo-replay-lab22
      - feat/gogogo-lifecycle-lab23
      - feat/gogogo-tencent-probe-lab24
      - feat/gogogo-provider-evidence-lab25

permissions:
  contents: read

concurrency:
  group: gogogo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android properties
        shell: bash
        run: |
          mkdir -p ci
          echo "step=prepare" > ci/diagnostic.txt
          echo "ANDROID_HOME=$ANDROID_HOME" >> ci/diagnostic.txt
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> ci/diagnostic.txt
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'TENCENT_MAP_KEY=DUMMY\n' >> local.properties
          printf 'MAPS_API_KEY=DUMMY\n' >> local.properties
          chmod +x gradlew

      - name: Verify Tianwaitian launcher
        run: python3 ci/verify_tianwaitian_launcher.py

      - name: Verify embedded fixture and isolated IPC contract
        run: python3 ci/verify_container_fixture_contract.py

      - name: Verify independent V3.1 demo and trusted import contract
        run: |
          python3 ci/verify_container_v31_contract.py
          python3 -m unittest discover -s ci -p 'test_container_v31_artifacts.py'
          python3 -m unittest discover -s ci -p 'test_phone_update_package.py'

      - name: Compile and smoke-test pure V0 Java without Android SDK
        run: bash ci/run_container_v0_jvm_smoke.sh

      - name: Test independent fixture and external demo, run application JVM tests and build APKs
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :containerFixture:testDebugUnitTest :externalDemo:testDebugUnitTest :externalDemo:lintDebug :externalDemo:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee ci/latest-build.txt
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> ci/diagnostic.txt
          echo "BUILD_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Verify the BUILT APK opens Tianwaitian
        id: verify_apk
        if: env.BUILD_EXIT_CODE == '0'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee ci/apk-badging.txt
          grep -F "package: name='com.soozooq.gogogo.test'" ci/apk-badging.txt
          grep -F "launchable-activity: name='com.zcshou.gogogo.TianwaitianHomeActivity'" ci/apk-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > ci/v0-manifest.txt
          grep -F "VirtualContainerV0Activity" ci/v0-manifest.txt
          grep -F "VirtualContainerV0IpcServiceB" ci/v0-manifest.txt
          grep -F "VirtualContainerV1ProxyActivity" ci/v0-manifest.txt
          grep -F "VirtualContainerV2Activity" ci/v0-manifest.txt
          grep -F "VirtualContainerV2ProxyActivity" ci/v0-manifest.txt
          grep -F "VirtualContainerV2SessionActivity" ci/v0-manifest.txt
          grep -F "VirtualContainerV23RecreationActivity" ci/v0-manifest.txt
          grep -F "VirtualContainerV24Activity" ci/v0-manifest.txt
          grep -F "VirtualContainerV24WorkerService" ci/v0-manifest.txt
          grep -F "VirtualContainerV3ArchiveActivity" ci/v0-manifest.txt
          grep -F "virtualv24" ci/v0-manifest.txt
          unzip -p "$APK" assets/twt-fixture-v0.apk > ci/embedded-v0-fixture.apk
          test -s ci/embedded-v0-fixture.apk
          unzip -t ci/embedded-v0-fixture.apk > ci/v0-fixture-zip-test.txt
          "$AAPT" dump xmltree ci/embedded-v0-fixture.apk AndroidManifest.xml > ci/v2-fixture-manifest.txt
          grep -F "GuestV2DeclaredActivity" ci/v2-fixture-manifest.txt
          "$AAPT" dump badging ci/embedded-v0-fixture.apk | tee ci/v0-fixture-badging.txt
          grep -F "package: name='com.soozooq.tianwaitian.fixture'" ci/v0-fixture-badging.txt
          # Verify the separate fixture APK (not host R) contains real compiled
          # guest layout, drawable, string marker and button resources.
          "$AAPT" dump resources ci/embedded-v0-fixture.apk > ci/v1-fixture-resources.txt
          grep -F "layout/guest_panel" ci/v1-fixture-resources.txt
          grep -F "drawable/guest_mark" ci/v1-fixture-resources.txt
          grep -F "string/guest_resource_marker" ci/v1-fixture-resources.txt
          unzip -l ci/embedded-v0-fixture.apk | grep -F "classes.dex"
          sha256sum ci/embedded-v0-fixture.apk | tee ci/v0-fixture-sha256.txt

      - name: Verify independently built V3.1 demo and exact-SHA Host admission
        id: verify_v31
        if: env.BUILD_EXIT_CODE == '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_container_v31_artifacts.py \
            --host-dir app/build/outputs/apk/debug \
            --demo-dir externalDemo/build/outputs/apk/debug \
            --trust app/build/generated/containerV31/external-demo-trust.json \
            --sdk "$ANDROID_HOME" \
            --commit "$(git rev-parse HEAD)" \
            --output ci/v31-artifacts.json

      - name: Stage one flat, verified phone update download
        id: stage_phone_update
        if: env.BUILD_EXIT_CODE == '0' && steps.verify_apk.outcome == 'success' && steps.verify_v31.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/stage_phone_update.py \
            --host-dir app/build/outputs/apk/debug \
            --demo-dir externalDemo/build/outputs/apk/debug \
            --evidence ci/v31-artifacts.json \
            --output-dir app/build/outputs/phone-update

      - name: Upload one phone update package
        if: steps.stage_phone_update.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tianwaitian-phone-update
          # upload-artifact creates the only ZIP; APKs are flat, not nested ZIPs.
          path: app/build/outputs/phone-update/*
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_number }}
          path: |
            ci/diagnostic.txt
            ci/latest-build.txt
            ci/apk-badging.txt
            ci/v0-manifest.txt
            ci/v0-fixture-badging.txt
            ci/v0-fixture-sha256.txt
            ci/v0-fixture-zip-test.txt
            ci/v1-fixture-resources.txt
            ci/v2-fixture-manifest.txt
            ci/v31-artifacts.json
            app/build/generated/containerV31/external-demo-trust.json
            app/build/test-results/testDebugUnitTest/
            containerFixture/build/test-results/testDebugUnitTest/
            externalDemo/build/test-results/testDebugUnitTest/
            externalDemo/build/reports/lint-results*
          if-no-files-found: ignore

      - name: Upload APK
        # A compiled APK is not a deliverable until the installed package,
        # launcher, private V0 services and embedded guest fixture all verify.
        if: env.BUILD_EXIT_CODE == '0' && steps.verify_apk.outcome == 'success' && steps.verify_v31.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gogogo-unified-labs-preview
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload standalone V3.1 demo APK file for explicit phone selection
        # This is a separate ordinary file, not another installation or a host asset.
        if: env.BUILD_EXIT_CODE == '0' && steps.verify_apk.outcome == 'success' && steps.verify_v31.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tianwaitian-v31-external-demo
          path: |
            externalDemo/build/outputs/apk/debug/*.apk
            ci/v31-artifacts.json
          if-no-files-found: error

      - name: Mark build failed
        if: env.BUILD_EXIT_CODE != '0'
        run: exit 1
