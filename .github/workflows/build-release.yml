name: Build No-Map APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - x8-compat
      - fix/x8-modern-amap
      - feat/gogogo-lab-phase1
      - feat/gogogo-lab-phase2
      - feat/gogogo-lab-phase3
      - feat/gogogo-lab-phase4
      - feat/gogogo-lab-phase5
      - feat/gogogo-lab-phase6
      - feat/gogogo-lab-phase7
      - feat/gogogo-lab-phase8
      - feat/gogogo-lab-phase9
      - feat/gogogo-lab-phase10
      - feat/gogogo-lab-phase12
      - feat/gogogo-lab-phase13
      - feat/gogogo-ui-refresh
      - feat/gogogo-heading-lab14
      - feat/gogogo-heading-lab15
      - feat/gogogo-consumer-lab16
      - feat/gogogo-session-lab17
      - feat/gogogo-session-lab17-1
      - feat/gogogo-session-lab17-2
      - feat/gogogo-session-lab17-2-1
      - feat/gogogo-session-lab17-3
      - feat/gogogo-auto-lab18
      - feat/gogogo-survival-lab19
      - feat/gogogo-reliability-lab20

permissions:
  contents: read

concurrency:
  group: gogogo-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android properties
        shell: bash
        run: |
          mkdir -p ci
          echo "step=prepare" > ci/diagnostic.txt
          echo "ANDROID_HOME=$ANDROID_HOME" >> ci/diagnostic.txt
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> ci/diagnostic.txt
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'TENCENT_MAP_KEY=DUMMY\n' >> local.properties
          printf 'MAPS_API_KEY=DUMMY\n' >> local.properties
          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee ci/latest-build.txt
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> ci/diagnostic.txt
          echo "BUILD_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_number }}
          path: |
            ci/diagnostic.txt
            ci/latest-build.txt
          if-no-files-found: ignore

      - name: Upload APK
        if: env.BUILD_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: gogogo-reliability-lab20
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Mark build failed
        if: env.BUILD_EXIT_CODE != '0'
        run: exit 1
