name: Show Android Signing SHA1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sha1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show signing SHA1
        run: |
          echo "=== COPY THE SHA1 BELOW ==="
          keytool -list -v \
            -keystore keystore/GoGoGo.jks \
            -alias GoGoKey \
            -storepass GoGoGo \
            -keypass GoGoGo | grep -E "SHA1:|SHA-1:"
