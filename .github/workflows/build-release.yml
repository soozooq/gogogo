name: Build Preview APK

on:
  workflow_dispatch:
  # Build installable debug previews before merging UI/diagnostic labs.
  # This workflow uses read-only permissions and dummy public test keys.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - integration/gogogo-labs-main-20261009
      - x8-compat
      - fix/x8-modern-amap
      - feat/gogogo-lab-phase1
      - feat/gogogo-lab-phase2
      - feat/gogogo-lab-phase3
      - feat/gogogo-lab-phase4
      - feat/gogogo-lab-phase5
      - feat/gogogo-lab-phase6
      - feat/gogogo-lab-phase7
      - feat/gogogo-lab-phase8
      - feat/gogogo-lab-phase9
      - feat/gogogo-lab-phase10
      - feat/gogogo-lab-phase12
      - feat/gogogo-lab-phase13
      - feat/gogogo-ui-refresh
      - feat/gogogo-heading-lab14
      - feat/gogogo-heading-lab15
      - feat/gogogo-consumer-lab16
      - feat/gogogo-session-lab17
      - feat/gogogo-session-lab17-1
      - feat/gogogo-session-lab17-2
      - feat/gogogo-session-lab17-2-1
      - feat/gogogo-session-lab17-3
      - feat/gogogo-auto-lab18
      - feat/gogogo-survival-lab19
      - feat/gogogo-reliability-lab20
      - feat/gogogo-simulation-lab21
      - feat/gogogo-replay-lab22
      - feat/gogogo-lifecycle-lab23
      - feat/gogogo-tencent-probe-lab24
      - feat/gogogo-provider-evidence-lab25

permissions:
  contents: read

concurrency:
  group: gogogo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android properties
        shell: bash
        run: |
          mkdir -p ci
          echo "step=prepare" > ci/diagnostic.txt
          echo "ANDROID_HOME=$ANDROID_HOME" >> ci/diagnostic.txt
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> ci/diagnostic.txt
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'TENCENT_MAP_KEY=DUMMY\n' >> local.properties
          printf 'MAPS_API_KEY=DUMMY\n' >> local.properties
          chmod +x gradlew

      - name: Verify Tianwaitian launcher
        run: python3 ci/verify_tianwaitian_launcher.py

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee ci/latest-build.txt
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> ci/diagnostic.txt
          echo "BUILD_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Verify the BUILT APK opens Tianwaitian
        if: env.BUILD_EXIT_CODE == '0'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee ci/apk-badging.txt
          grep -F "launchable-activity: name='com.zcshou.gogogo.TianwaitianHomeActivity'" ci/apk-badging.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_number }}
          path: |
            ci/diagnostic.txt
            ci/latest-build.txt
          if-no-files-found: ignore

      - name: Upload APK
        if: env.BUILD_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: gogogo-unified-labs-preview
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Mark build failed
        if: env.BUILD_EXIT_CODE != '0'
        run: exit 1

  # Manual only, pinned upstream engine reference; not a Tianwaitian integration.
  build-blackbox-reference:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/tianwaitian-container-v0-20261017' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout fixed upstream NewBlackbox revision
        uses: actions/checkout@v4
        with:
          repository: ALEX5402/NewBlackbox
          ref: 89b59836c66f173756a4ae258cf379a957649820
          path: blackbox-source
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;29.0.13846066" "platforms;android-35"
      - name: Build separate upstream ARM64 debug APK
        working-directory: blackbox-source
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Save standalone ARM64 reference for controlled testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NewBlackbox-ARM64-REFERENCE-UNVERIFIED
          path: blackbox-source/app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7
