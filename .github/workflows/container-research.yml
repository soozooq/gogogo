name: Container research

on:
  workflow_dispatch:
    inputs:
      run_translated_target_probe:
        description: 'Opt in only after changing the control environment; recorded API30/32 originals crash before container startup'
        required: false
        default: false
        type: boolean
      run_arm64_software_probe:
        description: 'Qualify an ARM64 software guest with explicit TCG, then run ordinary UI if boot succeeds'
        required: false
        default: false
        type: boolean
      inspect_cuttlefish_arm_host:
        description: 'Record native ARM Linux QEMU and Cuttlefish host prerequisites; does not boot Android'
        required: false
        default: false
        type: boolean
      run_cuttlefish_arm_boot:
        description: 'Boot one pinned Android13 ARM64 Cuttlefish instance using explicit TCG; no app tests'
        required: false
        default: false
        type: boolean
      run_cuttlefish_container_probe:
        description: 'Run matched target startup, then owned Guest location with the exact same-run self-owned APK set'
        required: false
        default: false
        type: boolean
  push:
    branches: [research/container-api33-20261023]
    paths:
      - research/container-api33/probe-host/**
      - research/container-api33/location-consumer/**
      - research/container-api33/patches/**
      - research/container-api33/tools/**
      - research/container-api33/tests/**
      - research/container-api33/sources.json
      - research/container-api33/cuttlefish-inputs.json
      - research/container-api33/licenses/**
      - research/container-api33/THIRD_PARTY_NOTICES.md
      - research/container-api33/CI_SOURCE_AND_RELINK.md
      - app/src/**
      - app/build.gradle
      - externalDemo/**
      - build.gradle
      - settings.gradle
      - gradle/**
      - ci/verify_tianwaitian_launcher.py
      - ci/verify_container_v31_artifacts.py
      - .github/workflows/container-research.yml

permissions:
  contents: read

jobs:
  build:
    name: Build, inspect and ordinary entry (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check cloud startup driver controls without a device
        run: python3 -m unittest discover -s research/container-api33/tests -v
      - name: Set dedicated work directories after runner allocation
        run: |
          echo "CONTAINER_RESEARCH_WORKDIR=$RUNNER_TEMP/container-research" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/container-research-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/container-research/evidence"
          uname -a > "$RUNNER_TEMP/container-research/evidence/host-platform.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Expose the command-line tools path used by the verifiers
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/apkanalyzer"
            test ! -e "$ANDROID_HOME/cmdline-tools/latest"
            ln -s 16.0 "$ANDROID_HOME/cmdline-tools/latest"
          fi
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
      - name: Install the fixed SDK toolchain serially
        run: sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-30' 'platforms;android-33' 'platforms;android-34' 'platforms;android-36' 'build-tools;33.0.2' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;25.1.8937393' 'cmake;3.22.1'
      - name: Prepare pinned source, apply reviewed patch and build
        run: |
          set -euo pipefail
          python3 research/container-api33/tools/prepare.py --workdir "$CONTAINER_RESEARCH_WORKDIR" --candidate blackbox
          bash research/container-api33/tools/run-build.sh blackbox :BCore:assembleDebug :probeHost:assembleDebug :probeHost:assembleDebugAndroidTest :locationConsumer:assembleDebug :probeHost:writeResearchDependencyInventory
      - name: Inspect compiled inputs and license declarations
        run: |
          set -euo pipefail
          python3 research/container-api33/tools/inspect-apk.py --sdk "$ANDROID_HOME" --host "$CONTAINER_RESEARCH_WORKDIR/probe-host-build/outputs/apk/debug/probeHost-debug.apk" --output "$CONTAINER_RESEARCH_WORKDIR/evidence/host-artifact.json"
          python3 research/container-api33/tools/inspect-location-consumer.py --sdk "$ANDROID_HOME" --apk "$CONTAINER_RESEARCH_WORKDIR/location-consumer-build/outputs/apk/debug/locationConsumer-debug.apk" --output "$CONTAINER_RESEARCH_WORKDIR/evidence/consumer-artifact.json"
          python3 research/container-api33/tools/inspect-third-party-apk.py --sdk "$ANDROID_HOME" --apk "$CONTAINER_RESEARCH_WORKDIR/guest/osmdroidRelease-v3.10.6.apk" --output "$CONTAINER_RESEARCH_WORKDIR/evidence/gpstest-artifact.json"
          python3 research/container-api33/tools/license-inventory.py --graph "$CONTAINER_RESEARCH_WORKDIR/evidence/runtime-dependencies.json" --gradle-cache "${GRADLE_USER_HOME:-$HOME/.gradle}" --output "$CONTAINER_RESEARCH_WORKDIR/evidence/dependency-licenses.json"
          git rev-parse HEAD > "$CONTAINER_RESEARCH_WORKDIR/evidence/research-commit.txt"
      - name: Compile and check compact feedback without a phone artifact
        run: |
          set -euo pipefail
          if [ ! -f local.properties ]; then
            cat > local.properties <<'PROPERTIES'
          MAPS_API_KEY=DUMMY
          MAPS_SAFE_CODE=DUMMY
          TENCENT_MAP_KEY=DUMMY
          PROPERTIES
          fi
          python3 ci/verify_tianwaitian_launcher.py
          feedback_status=0
          bash ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain || feedback_status=$?
          feedback_evidence="$CONTAINER_RESEARCH_WORKDIR/evidence/feedback-main"
          mkdir -p "$feedback_evidence/unit"
          git rev-parse HEAD > "$feedback_evidence/commit.txt"
          sha256sum app/src/main/java/com/zcshou/gogogo/LabFeedbackReport.java app/src/main/java/com/zcshou/gogogo/LabSupportLog.java app/src/main/java/com/zcshou/gogogo/LabHubActivity.java app/src/test/java/com/zcshou/gogogo/LabFeedbackReportTest.java > "$feedback_evidence/source-sha256.txt"
          sha256sum app/src/main/java/com/zcshou/gogogo/TianwaitianContainerPreview.java app/src/main/java/com/zcshou/gogogo/TianwaitianHomeActivity.java app/src/main/AndroidManifest.xml >> "$feedback_evidence/source-sha256.txt"
          if [ -d app/build/test-results/testDebugUnitTest ]; then
            cp app/build/test-results/testDebugUnitTest/TEST-*.xml "$feedback_evidence/unit/"
          fi
          if [ -f app/build/reports/lint-results-debug.xml ]; then
            cp app/build/reports/lint-results-debug.xml "$feedback_evidence/"
          fi
          echo "$feedback_status" > "$feedback_evidence/returncode.txt"
          exit "$feedback_status"
      - name: Prepare own host, driver and consumer for the same CI run (no original target APKs)
        if: ${{ inputs.run_cuttlefish_container_probe || contains(github.event.head_commit.message, '[cuttlefish-container]') || contains(github.event.head_commit.message, '[visual-layout]') }}
        run: python3 research/container-api33/tools/ci_owned_apks.py --workdir "$CONTAINER_RESEARCH_WORKDIR" --output "$RUNNER_TEMP/ci-owned-container-apks" --include-consumer
      - name: Transfer only the self-owned APKs for ARM CI (14 days, not a phone release)
        if: ${{ inputs.run_cuttlefish_container_probe || contains(github.event.head_commit.message, '[cuttlefish-container]') || contains(github.event.head_commit.message, '[visual-layout]') }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-owned-container-apks-${{ github.sha }}
          path: ${{ runner.temp }}/ci-owned-container-apks/
          retention-days: 14
          if-no-files-found: error
      - name: Allow the dedicated Linux runner to use its KVM device if available
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Build the own main app for rendering checks only (never a phone APK)
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --init-script docs/build-profiles/main-preview-2.4.36.init.gradle --init-script docs/build-profiles/visual-check-x86.init.gradle :app:assembleDebug --console=plain
          cp app/build/outputs/apk/debug/Go_2.4.36-container-preview_arm64-v8a_debug.apk "$CONTAINER_RESEARCH_WORKDIR/visual-main-x86.apk"
          echo "TWT_VISUAL_MAIN_APK=$CONTAINER_RESEARCH_WORKDIR/visual-main-x86.apk" >> "$GITHUB_ENV"
      - name: Run ordinary import and calculator regression on x86_64
        run: bash research/container-api33/tools/run-emulator-checks.sh x86_64
      - name: Upload build evidence (no APK distribution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-research-linux-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/container-research/evidence/
          if-no-files-found: ignore

  arm-mac-build:
    name: Build and inspect (ARM Mac)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set dedicated work directories after runner allocation
        run: |
          echo "CONTAINER_RESEARCH_WORKDIR=$RUNNER_TEMP/container-research" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/container-research-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/container-research/evidence"
          uname -a > "$RUNNER_TEMP/container-research/evidence/host-platform.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Expose the command-line tools path used by the verifiers
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/apkanalyzer"
            test ! -e "$ANDROID_HOME/cmdline-tools/latest"
            ln -s 16.0 "$ANDROID_HOME/cmdline-tools/latest"
          fi
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
      - name: Record actual host and install fixed build toolchain
        run: |
          set -euo pipefail
          mkdir -p "$CONTAINER_RESEARCH_WORKDIR/evidence"
          uname -a > "$CONTAINER_RESEARCH_WORKDIR/evidence/host-platform.txt"
          test "$(uname -m)" = arm64
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-30' 'platforms;android-33' 'platforms;android-34' 'build-tools;33.0.2' 'ndk;25.1.8937393' 'cmake;3.22.1'
      - name: Build standalone host and driver on ARM host
        run: |
          set -euo pipefail
          python3 research/container-api33/tools/prepare.py --workdir "$CONTAINER_RESEARCH_WORKDIR" --candidate blackbox
          bash research/container-api33/tools/run-build.sh blackbox :probeHost:assembleDebug :probeHost:assembleDebugAndroidTest
          python3 research/container-api33/tools/inspect-apk.py --sdk "$ANDROID_HOME" --host "$CONTAINER_RESEARCH_WORKDIR/probe-host-build/outputs/apk/debug/probeHost-debug.apk" --output "$CONTAINER_RESEARCH_WORKDIR/evidence/host-artifact.json"
          git rev-parse HEAD > "$CONTAINER_RESEARCH_WORKDIR/evidence/research-commit.txt"
      - name: Qualify ARM64 software guest (explicit research opt-in)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_arm64_software_probe) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[arm64-software]')) }}
        run: bash research/container-api33/tools/run-arm-mac-software-checks.sh
      - name: Upload ARM Mac build evidence (no APK distribution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-research-arm-mac-build-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/container-research/evidence/
          if-no-files-found: ignore

  cuttlefish-arm-host:
    name: Inspect ARM Linux host and optional Cuttlefish boot
    needs: build
    # Keep the old workflow group so its active ARM64 run finishes before this job.
    # New Linux/Mac prerequisites can run while the expensive native job waits.
    concurrency:
      group: container-research-${{ github.ref }}
      cancel-in-progress: false
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.inspect_cuttlefish_arm_host || inputs.run_cuttlefish_arm_boot || inputs.run_cuttlefish_container_probe)) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[cuttlefish-host]') || contains(github.event.head_commit.message, '[cuttlefish-boot]'))) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ (inputs.run_cuttlefish_container_probe || contains(github.event.head_commit.message, '[cuttlefish-container]')) && 150 || (contains(github.event.head_commit.message, '[cuttlefish-startup]') && 120 || 50) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Receive the exact same-run self-owned APKs (no original target APKs)
        if: ${{ inputs.run_cuttlefish_container_probe || contains(github.event.head_commit.message, '[cuttlefish-container]') }}
        uses: actions/download-artifact@v4
        with:
          name: ci-owned-container-apks-${{ github.sha }}
          path: ${{ runner.temp }}/ci-owned-container-apks
      - name: Install native QEMU and module inspection tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cuttlefish-host"
          sudo apt-get update > "$RUNNER_TEMP/cuttlefish-host/package-install.txt" 2>&1
          sudo apt-get install --no-install-recommends -y qemu-system-arm ipxe-qemu kmod iproute2 >> "$RUNNER_TEMP/cuttlefish-host/package-install.txt" 2>&1
          # The pinned host package validates these real memberships even for TCG.
          # Group membership does not supply KVM; actual device availability stays recorded.
          sudo groupadd --force cvdnetwork
          sudo groupadd --force kvm
          sudo usermod --append --groups cvdnetwork,kvm "$(id -un)"
      - name: Record actual host capabilities without launching a guest
        run: python3 research/container-api33/tools/inspect-cuttlefish-arm-host.py --prepare-host --output "$RUNNER_TEMP/cuttlefish-host/probe"
      - name: Check original startup control logic without a device
        run: python3 -m unittest discover -s research/container-api33/tests -v
      - name: Qualify pinned Android13 ARM64 system and optional original startup
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.run_cuttlefish_arm_boot || inputs.run_cuttlefish_container_probe)) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[cuttlefish-boot]')) }}
        # Refresh supplementary groups as the SAME ordinary runner user; retain proxy/CA.
        run: |
          set -euo pipefail
          cvd_arguments=(--host-report "$RUNNER_TEMP/cuttlefish-host/probe/report.json" --workdir "$RUNNER_TEMP/cuttlefish-arm-boot" --boot-seconds ${{ contains(github.event.head_commit.message, '[cuttlefish-diagnose]') && '300' || '2400' }})
          if [[ '${{ inputs.run_cuttlefish_container_probe || contains(github.event.head_commit.message, '[cuttlefish-startup]') || contains(github.event.head_commit.message, '[cuttlefish-container]') }}' == true ]]; then
            cvd_arguments+=(--original-baselines)
          fi
          if [[ '${{ inputs.run_cuttlefish_container_probe || contains(github.event.head_commit.message, '[cuttlefish-container]') }}' == true ]]; then
            cvd_arguments+=(--container-apks "$RUNNER_TEMP/ci-owned-container-apks" --owned-location-check)
          fi
          sudo -n -E -u "$(id -un)" -- python3 research/container-api33/tools/run-cuttlefish-arm-boot.py "${cvd_arguments[@]}"
      - name: Upload host and optional boot diagnostics (no images or APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuttlefish-arm-host-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/cuttlefish-host/
            ${{ runner.temp }}/cuttlefish-arm-boot/evidence/
          if-no-files-found: ignore

  official-target-startup:
    name: Anonymous startup (official Android 12L translation)
    # Keep the failed evidence. Unchanged, incompatible controls cannot test the container.
    # This is an optional environment qualification, never a passing target-compatibility gate.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_translated_target_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set dedicated work directories after runner allocation
        run: |
          echo "CONTAINER_RESEARCH_WORKDIR=$RUNNER_TEMP/container-research" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/container-research-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/container-research/evidence"
          uname -a > "$RUNNER_TEMP/container-research/evidence/host-platform.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Expose the command-line tools path used by the verifiers
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/apkanalyzer"
            test ! -e "$ANDROID_HOME/cmdline-tools/latest"
            ln -s 16.0 "$ANDROID_HOME/cmdline-tools/latest"
          fi
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
      - name: Install the fixed SDK toolchain serially
        run: sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-30' 'platforms;android-33' 'platforms;android-34' 'build-tools;33.0.2' 'ndk;25.1.8937393' 'cmake;3.22.1'
      - name: Prepare pinned source, apply reviewed patch and build
        run: |
          set -euo pipefail
          python3 research/container-api33/tools/prepare.py --workdir "$CONTAINER_RESEARCH_WORKDIR" --candidate blackbox
          bash research/container-api33/tools/run-build.sh blackbox :BCore:assembleDebug :probeHost:assembleDebug :probeHost:assembleDebugAndroidTest
      - name: Record this source and inspect the unchanged multi-ABI host
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$CONTAINER_RESEARCH_WORKDIR/evidence/research-commit.txt"
          python3 research/container-api33/tools/inspect-apk.py --sdk "$ANDROID_HOME" --host "$CONTAINER_RESEARCH_WORKDIR/probe-host-build/outputs/apk/debug/probeHost-debug.apk" --output "$CONTAINER_RESEARCH_WORKDIR/evidence/host-artifact.json"
      - name: Allow this dedicated runner to use KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Compare original installed and container anonymous startup
        run: bash research/container-api33/tools/run-target-emulator-checks.sh
      - name: Upload anonymous startup evidence (no APK distribution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-research-target-startup-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/container-research/evidence/
          if-no-files-found: ignore
