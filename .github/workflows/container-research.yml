name: Container research

on:
  workflow_dispatch:
  push:
    branches: [research/container-api33-20261023]
    paths:
      - research/container-api33/**
      - ci/verify_container_v31_artifacts.py
      - .github/workflows/container-research.yml

permissions:
  contents: read

concurrency:
  group: container-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, inspect and ordinary entry (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTAINER_RESEARCH_WORKDIR: ${{ runner.temp }}/container-research
      ANDROID_AVD_HOME: ${{ runner.temp }}/container-research-avd
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the fixed SDK toolchain serially
        run: sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-30' 'platforms;android-33' 'platforms;android-34' 'build-tools;33.0.2' 'ndk;25.1.8937393' 'cmake;3.22.1'
      - name: Prepare pinned source, apply reviewed patch and build
        run: |
          set -euo pipefail
          python3 research/container-api33/tools/prepare.py --workdir "$CONTAINER_RESEARCH_WORKDIR" --candidate blackbox
          bash research/container-api33/tools/run-build.sh blackbox :BCore:assembleDebug :probeHost:assembleDebug :probeHost:assembleDebugAndroidTest :locationConsumer:assembleDebug :probeHost:writeResearchDependencyInventory
      - name: Inspect compiled inputs and license declarations
        run: |
          set -euo pipefail
          python3 research/container-api33/tools/inspect-apk.py --sdk "$ANDROID_HOME" --host "$CONTAINER_RESEARCH_WORKDIR/probe-host-build/outputs/apk/debug/probeHost-debug.apk" --output "$CONTAINER_RESEARCH_WORKDIR/evidence/host-artifact.json"
          python3 research/container-api33/tools/inspect-location-consumer.py --sdk "$ANDROID_HOME" --apk "$CONTAINER_RESEARCH_WORKDIR/location-consumer-build/outputs/apk/debug/locationConsumer-debug.apk" --output "$CONTAINER_RESEARCH_WORKDIR/evidence/consumer-artifact.json"
          python3 research/container-api33/tools/inspect-third-party-apk.py --sdk "$ANDROID_HOME" --apk "$CONTAINER_RESEARCH_WORKDIR/guest/osmdroidRelease-v3.10.6.apk" --output "$CONTAINER_RESEARCH_WORKDIR/evidence/gpstest-artifact.json"
          python3 research/container-api33/tools/license-inventory.py --graph "$CONTAINER_RESEARCH_WORKDIR/evidence/runtime-dependencies.json" --gradle-cache "${GRADLE_USER_HOME:-$HOME/.gradle}" --output "$CONTAINER_RESEARCH_WORKDIR/evidence/dependency-licenses.json"
          git rev-parse HEAD > "$CONTAINER_RESEARCH_WORKDIR/evidence/research-commit.txt"
      - name: Run ordinary import and calculator regression on x86_64
        run: bash research/container-api33/tools/run-emulator-checks.sh x86_64
      - name: Upload build evidence (no APK distribution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-research-linux-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/container-research/evidence/
          if-no-files-found: ignore

  arm64-runtime:
    name: ARM64 ordinary-entry attempt (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CONTAINER_RESEARCH_WORKDIR: ${{ runner.temp }}/container-research
      ANDROID_AVD_HOME: ${{ runner.temp }}/container-research-avd
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Record actual host and install fixed build toolchain
        run: |
          set -euo pipefail
          mkdir -p "$CONTAINER_RESEARCH_WORKDIR/evidence"
          uname -a > "$CONTAINER_RESEARCH_WORKDIR/evidence/host-platform.txt"
          test "$(uname -m)" = arm64
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-30' 'platforms;android-33' 'platforms;android-34' 'build-tools;33.0.2' 'ndk;25.1.8937393' 'cmake;3.22.1'
      - name: Build standalone host and driver on ARM host
        run: |
          set -euo pipefail
          python3 research/container-api33/tools/prepare.py --workdir "$CONTAINER_RESEARCH_WORKDIR" --candidate blackbox
          bash research/container-api33/tools/run-build.sh blackbox :probeHost:assembleDebug :probeHost:assembleDebugAndroidTest
          python3 research/container-api33/tools/inspect-apk.py --sdk "$ANDROID_HOME" --host "$CONTAINER_RESEARCH_WORKDIR/probe-host-build/outputs/apk/debug/probeHost-debug.apk" --output "$CONTAINER_RESEARCH_WORKDIR/evidence/host-artifact.json"
          git rev-parse HEAD > "$CONTAINER_RESEARCH_WORKDIR/evidence/research-commit.txt"
      - name: Attempt matching ARM system and ordinary-entry flow
        run: bash research/container-api33/tools/run-emulator-checks.sh arm64-v8a
      - name: Upload actual ARM attempt evidence (no APK distribution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-research-arm64-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/container-research/evidence/
          if-no-files-found: ignore
