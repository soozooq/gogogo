name: Phone preview delivery

on:
  workflow_dispatch:
  push:
    branches: [research/container-api33-20261023]
    paths:
      - .github/workflows/phone-preview-draft.yml
      - ci/restore_preview_signature.py
      - ci/stage_rootless_phone_preview.py
      - ci/test_restore_preview_signature.py
      - ci/preview_release.py
      - ci/qualify_native_preview.py
      - ci/test_preview_release.py
      - ci/phone-preview/**

permissions:
  contents: read

concurrency:
  group: tianwaitian-phone-preview-draft
  cancel-in-progress: false

jobs:
  delivery-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Read the committed delivery hold before building a phone download
        id: policy
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('ci/release-qualifications/2.4.35.json').read_text())
          enabled = policy['publish_enabled'] is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled=' + str(enabled).lower() + '\n')
          print('Phone delivery enabled:', enabled)
          PY
  stage-draft:
    needs: delivery-policy
    if: needs.delivery-policy.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: soozooq/gogogo
      SOURCE_COMMIT: 99940ea20ef4e7bee27a65fe759a810bf0942672
      PREVIEW_TAG: preview-2.4.35-container-99940ea2
    steps:
      - uses: actions/checkout@v5
        with:
          path: delivery
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 99940ea20ef4e7bee27a65fe759a810bf0942672
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Expose the verified command-line tools path
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/apkanalyzer"
            test ! -e "$ANDROID_HOME/cmdline-tools/latest"
            ln -s 16.0 "$ANDROID_HOME/cmdline-tools/latest"
          fi
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
      - name: Check public signature reconstruction without credentials
        run: python3 -m unittest discover -s delivery/ci -p test_restore_preview_signature.py -v
      - name: Check publication and retry boundaries
        run: python3 -m unittest discover -s delivery/ci -p test_preview_release.py -v
      - name: Prepare the fixed SDK and placeholder build profile
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-36' 'build-tools;33.0.2' 'build-tools;35.0.0' 'build-tools;36.0.0'
          printf 'sdk.dir=%s\nTENCENT_MAP_KEY=DUMMY\nMAPS_API_KEY=DUMMY\nMAPS_SAFE_CODE=DUMMY\n' "$ANDROID_HOME" > source/local.properties
          mkdir package-work
      - name: Build and check the fixed-source main preview
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --init-script docs/build-profiles/main-preview-2.4.35.init.gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Receive only the pinned CI56 self-owned set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/soozooq/gogogo/actions/artifacts/12757735984 > package-work/artifact-api.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('package-work/artifact-api.json').read_text())
          assert value['id'] == 12757735984 and not value['expired']
          assert value['workflow_run']['id'] == 40555343592
          assert value['workflow_run']['head_sha'] == '99940ea20ef4e7bee27a65fe759a810bf0942672'
          assert value['digest'] == 'sha256:a1fbfa61b7a0d6c4c017effca410e51d0288c33918e1b7c22efcc09502b57f4c'
          PY
          gh api repos/soozooq/gogogo/actions/artifacts/12757735984/zip > package-work/owned.zip
          python3 - <<'PY'
          import json
          from pathlib import Path
          inputs = {'run_id': 40555343592, 'commit': '99940ea20ef4e7bee27a65fe759a810bf0942672',
                    'artifacts': {'own': {'id': 12757735984, 'path': str(Path('package-work/owned.zip').resolve()),
                    'sha256': 'a1fbfa61b7a0d6c4c017effca410e51d0288c33918e1b7c22efcc09502b57f4c'}}}
          Path('package-work/verification-inputs.json').write_text(json.dumps(inputs))
          PY
          python3 source/research/container-api33/tools/verify-ci-receipts.py --repo source --sdk "$ANDROID_HOME" --inputs package-work/verification-inputs.json --output package-work/verified-owned.json
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('package-work/owned.zip') as archive:
              Path('package-work/base-host.apk').write_bytes(archive.read('probeHost-debug.apk'))
          PY
      - name: Restore the exact privately signed host using public APK metadata
        run: python3 delivery/ci/restore_preview_signature.py --base package-work/base-host.apk --recipe delivery/ci/phone-preview/host-signature-99940ea2.json --output package-work/signed-host.apk
      - name: Stage only the two verified phone APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 delivery/ci/stage_rootless_phone_preview.py --source source --host package-work/signed-host.apk --base-host package-work/base-host.apk --sdk "$ANDROID_HOME" --output package-work/staged --delivery-run-id "$GITHUB_RUN_ID"
      - name: Save one flat phone download and its receipt
        uses: actions/upload-artifact@v4
        with:
          name: tianwaitian-phone-preview-2.4.35-99940ea2
          path: package-work/staged/*
          if-no-files-found: error
          retention-days: 14

      - name: Create or verify only this source's unpublished draft
        continue-on-error: true
        working-directory: delivery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/preview_release.py stage --config ci/release-qualifications/2.4.35.json --package-dir ../package-work/staged --work ../package-work/draft --delivery-run "$GITHUB_RUN_ID"
      - name: Preserve staging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-preview-staging-diagnostics
          path: |
            package-work/artifact-api.json
            package-work/verification-inputs.json
            package-work/verified-owned.json
            package-work/draft/*.json
          if-no-files-found: ignore
          retention-days: 14

  publish-matched:
    needs: stage-draft
    runs-on: ubuntu-latest
    timeout-minutes: 175
    permissions:
      actions: write
      checks: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Prepare only APK verification tools
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/apkanalyzer"
            test ! -e "$ANDROID_HOME/cmdline-tools/latest"
            ln -s 16.0 "$ANDROID_HOME/cmdline-tools/latest"
          fi
          sdkmanager --sdk_root="$ANDROID_HOME" 'build-tools;33.0.2' 'build-tools;35.0.0'
      - name: Wait for actual matched qualification and verify before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/preview_release.py publish --config ci/release-qualifications/2.4.35.json --sdk "$ANDROID_HOME" --work "$RUNNER_TEMP/matched-preview-publication" --delivery-run "$GITHUB_RUN_ID" --delivery-commit "$GITHUB_SHA"
      - name: Preserve qualification and actual publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matched-preview-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/matched-preview-publication/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Save the phone download only after full matched qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualified-phone-preview-2.4.35-99940ea2-${{ github.run_id }}
          path: ${{ runner.temp }}/matched-preview-publication/qualified-phone/*
          if-no-files-found: ignore
          retention-days: 14
